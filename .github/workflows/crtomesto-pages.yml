name: Črtomesto — check & deploy

on:
  push:
    branches: [main, "arena/**"]
    paths: ["crtomesto/**", ".github/workflows/crtomesto-pages.yml"]
  pull_request:
    paths: ["crtomesto/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crtomesto-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (JavaScript modules)
        run: |
          for f in crtomesto/game.js crtomesto/audio.js crtomesto/story.js crtomesto/world.js; do
            node --check "$f"
          done
      - name: Required files present
        run: |
          test -f crtomesto/index.html
          test -f crtomesto/assets/three.min.js
          test -f crtomesto/assets/cannon-es.js
          test -f crtomesto/assets/fonts/instrument-serif.ttf
          test -f crtomesto/assets/fonts/dm-sans.ttf

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crtomesto
      - id: deployment
        uses: actions/deploy-pages@v4
